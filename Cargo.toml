[package]
name = "tekken"
version = "0.2.0"
edition = "2024"
description = "Rust implementation of Mistral Tekken tokenizer with image and audio support"
authors = ["Jorge Menjivar"]
license = "Apache-2.0"
repository = "https://github.com/jorge-menjivar/tekken-rs"
homepage = "https://github.com/jorge-menjivar/tekken-rs"
documentation = "https://docs.rs/tekken"
readme = "README.md"
keywords = ["ai", "mistral", "multimodal", "nlp", "tokenizer"]
categories = ["multimedia", "science", "text-processing"]

include = [
  "Cargo.toml",
  "LICENSE",
  "NOTICE",
  "README.md",
  "examples/**/*",
  "src/**/*",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "tekken"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
required-features = ["audio"]

[[example]]
name = "audio_tokenization_test"
required-features = ["audio"]

[[example]]
name = "image_tokenization_test"
required-features = ["image"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
regex = "1.11.1"
rustc-hash = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tiktoken-rs = "0.9.1"

# Shared by the audio and image features
ndarray = { version = "0.16", optional = true }

# Audio feature
hound = { version = "3.5", optional = true }
rubato = { version = "3.0.0", optional = true }
rustfft = { version = "6.4.0", optional = true }

# Image feature
image = {
  version = "0.25",
  default-features = false,
  features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
  ],
  optional = true
}

[dev-dependencies]
approx = "0.5"
tempfile = "3.20.0"

[features]
default = ["audio", "image"]
# Decoding and tokenization of audio waveforms.
audio = ["dep:hound", "dep:ndarray", "dep:rubato", "dep:rustfft"]
# Decoding and preprocessing of images.
image = ["dep:image", "dep:ndarray"]
